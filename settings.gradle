pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'oldlightmap'

include 'mc1_21', 'mc26_1', 'mc26_2'
project(':mc1_21').projectDir = file('versions/mc1_21')
project(':mc26_1').projectDir = file('versions/mc26_1')

project(':mc26_2').projectDir = file('versions/mc26_2')
